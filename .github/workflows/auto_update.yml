name: 自动更新全能 AI 规则库

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动运行
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击按钮一键立即执行

jobs:
  update-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入仓库的权限
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 执行规则合并脚本
        run: python update_rules.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AI.list
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自动同步最新上游 AI 规则" && git push)
